name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHPUnit (PHP 8.3)
    runs-on: ubuntu-latest

    # Production runs MySQL and the app uses MySQL-only SQL (FIELD(), HAVING on aliases)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root

    defaults:
      run:
        working-directory: app_core

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, pdo_mysql, gd, exif, bcmath, xml, zip
          coverage: none

      - name: Create Laravel runtime directories
        run: mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing storage/logs

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: app_core/vendor
          key: composer-${{ hashFiles('app_core/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env 2>/dev/null || echo "APP_KEY=" > .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run PHPUnit
        run: php artisan test

      - name: Run Laravel Pint (code style)
        run: ./vendor/bin/pint --test
        continue-on-error: true
