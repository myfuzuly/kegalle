name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHPUnit (PHP 8.2)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app_core

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, gd, exif, bcmath, xml, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: app_core/vendor
          key: composer-${{ hashFiles('app_core/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env 2>/dev/null || echo "APP_KEY=" > .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run PHPUnit
        run: php artisan test --stop-on-failure

      - name: Run Laravel Pint (code style)
        run: ./vendor/bin/pint --test
        continue-on-error: true
